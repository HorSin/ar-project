<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>My First WebAR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    // WHY THREE.VideoTexture FAILS ON iOS MOBILE
    // ─────────────────────────────────────────────────────────────────────
    // THREE.VideoTexture uploads video frames via WebGL's texImage2D().
    // On iOS Safari the browser's hardware video decoder writes into a
    // protected IOSurface that WebGL cannot read when:
    //   • the <video> element is display:none  (A-Frame hides asset videos)
    //   • requestVideoFrameCallback (rVFC) is the update trigger (Three r146+)
    //   • the element was never in the visual render tree
    // Result: texture stays blank, audio still plays → "invisible video" bug.
    //
    // THE RELIABLE FIX — Canvas 2D intermediate
    // ─────────────────────────────────────────────────────────────────────
    // Draw each video frame into a Canvas 2D context with ctx.drawImage().
    // Canvas 2D reads video via a CPU-accessible path that bypasses every
    // iOS restriction above.  Then use THREE.CanvasTexture on that canvas.
    // This works on all browsers (iOS Safari, Android Chrome, WebView).
    AFRAME.registerComponent('video-texture-fix', {
      init: function () {
        var self = this;

        // Resolve the <video> element from src="#video-N".
        var srcAttr = this.el.getAttribute('src') || '';
        this._videoEl = srcAttr.charAt(0) === '#'
          ? document.getElementById(srcAttr.slice(1))
          : null;
        if (!this._videoEl) { return; }

        // Create an off-screen canvas and 2D context.
        this._canvas  = document.createElement('canvas');
        this._canvas.width  = 1280;   // will be updated on loadedmetadata
        this._canvas.height = 720;
        this._ctx = this._canvas.getContext('2d');

        // CanvasTexture reads the canvas pixels — no WebGL video path.
        this._texture = new THREE.CanvasTexture(this._canvas);
        this._texture.minFilter = THREE.LinearFilter;
        this._texture.magFilter = THREE.LinearFilter;

        // Keep canvas size in sync with the actual video dimensions.
        this._videoEl.addEventListener('loadedmetadata', function () {
          if (self._videoEl.videoWidth) {
            self._canvas.width  = self._videoEl.videoWidth;
            self._canvas.height = self._videoEl.videoHeight;
          }
        });

        // Assign the canvas texture to the mesh as soon as it is ready,
        // and again if Three.js ever rebuilds the mesh object.
        this.el.addEventListener('object3dset', function (e) {
          if (e.detail.type === 'mesh') { self._bindTexture(); }
        });
        this._bindTexture();
      },

      _bindTexture: function () {
        if (!this._texture) { return; }
        var mesh = this.el.getObject3D('mesh');
        if (!mesh) { return; }
        mesh.material.map         = this._texture;
        mesh.material.transparent = false;   // video has no alpha; avoid invisible
        mesh.material.needsUpdate = true;    // recompile shader with map defined
      },

      tick: function () {
        if (!this._ctx || !this._videoEl || !this._texture) { return; }
        // Only paint when there is a new decoded frame available.
        if (!this._videoEl.paused &&
            this._videoEl.readyState >= this._videoEl.HAVE_CURRENT_DATA) {
          this._ctx.drawImage(
            this._videoEl, 0, 0,
            this._canvas.width, this._canvas.height
          );
          this._texture.needsUpdate = true;  // upload the canvas to GPU
        }
      }
    });
  </script>

  <style>
    /* touch-action: none prevents iOS pull-to-refresh / Android back-swipe during swipes. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; }

    /* ---- Start-gate overlay ---- */
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 32px;
      background: #000; color: #fff; font-family: sans-serif;
      text-align: center; z-index: 9999; padding: 24px; box-sizing: border-box;
    }
    #loading p { margin: 0; font-size: 16px; opacity: 0.7; line-height: 1.5; }

    /* The tap-to-start button is ALSO the iOS audio-unlock gesture. */
    #start-btn {
      background: #fff; color: #000; border: none;
      padding: 16px 48px; font-size: 20px; font-weight: bold;
      border-radius: 50px; font-family: sans-serif; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #start-btn:disabled { opacity: 0.5; }

    /* ---- Scanning instruction overlay ---- */
    /* Shown after the camera starts; hidden on first targetFound. */
    #scan-instruction {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: none; flex-direction: column; align-items: center;
      justify-content: center; gap: 24px;
      background: rgba(0,0,0,0.78); color: #fff; font-family: sans-serif;
      text-align: center; z-index: 9998; padding: 32px; box-sizing: border-box;
      opacity: 0; transition: opacity 0.5s;
    }
    #scan-instruction.visible { display: flex; opacity: 1; }
    #scan-instruction h2 { margin: 0; font-size: 20px; font-weight: bold; line-height: 1.4; }
    #scan-instruction p  { margin: 0; font-size: 14px; opacity: 0.7; line-height: 1.5; }

    /* The target image thumbnail with a pulsing border so it draws the eye. */
    #scan-target-img {
      width: 180px; max-width: 55vw;
      border-radius: 12px;
      border: 3px solid #fff;
      box-shadow: 0 0 0 0 rgba(255,255,255,0.7);
      animation: scan-pulse 2s infinite;
    }
    @keyframes scan-pulse {
      0%   { box-shadow: 0 0 0  0   rgba(255,255,255,0.7); }
      50%  { box-shadow: 0 0 0 10px rgba(255,255,255,0);   }
      100% { box-shadow: 0 0 0  0   rgba(255,255,255,0);   }
    }

    /* ---- Swipe hint (fades in once on first target detection) ---- */
    #swipe-hint {
      position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55); color: #fff; font-family: sans-serif;
      font-size: 14px; padding: 8px 18px; border-radius: 20px;
      pointer-events: none; z-index: 9998; opacity: 0; transition: opacity 0.4s;
    }
    #swipe-hint.visible { opacity: 1; }

    /* ---- Dot indicator — shows which video is active ---- */
    #dot-indicator {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: none; gap: 10px; z-index: 9997; pointer-events: none;
    }
    #dot-indicator.visible { display: flex; }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: rgba(255,255,255,0.35); transition: background 0.3s;
    }
    .dot.active { background: #fff; transform: scale(1.25); }
  </style>
</head>

<body>
  <!-- Start-gate overlay. The button tap unlocks iOS audio AND camera. -->
  <div id="loading">
    <button id="start-btn">Tap to Start AR</button>
    <p>Point your camera at<br>your target photo after tapping.</p>
  </div>

  <!--
    Scanning instruction overlay.
    Shown after the camera starts (arReady), hidden on first targetFound.
    The stitch.png thumbnail shows users exactly which image to point at.
  -->
  <div id="scan-instruction">
    <img id="scan-target-img" src="stitch.png" alt="Target image" />
    <h2 id="scan-title">Point your camera at this image</h2>
    <p  id="scan-subtitle">Keep the image inside the camera view</p>
  </div>

  <!-- Swipe hint shown briefly on first target detection. -->
  <div id="swipe-hint">← Swipe to browse videos →</div>

  <!-- Dot indicator — one dot per video, shown once AR is tracking. -->
  <div id="dot-indicator">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- timeout="30000": gives slow mobile connections 30 s to buffer 5 videos. -->
    <a-assets timeout="30000">
      <!--
        VIDEO CAROUSEL ASSETS
        ============================================================
        - Replace src filenames with your own .mp4 files.
        - Keep ALL attributes as-is: muted is required for the iOS
          audio-unlock step; it is removed automatically right before
          actual playback by the JavaScript below.
        - loop is intentionally OMITTED so the 'ended' event fires and
          the carousel can auto-advance to the next video.
      -->
      <video id="video-0" src="video1.mp4" muted playsinline webkit-playsinline preload="auto"></video>
      <video id="video-1" src="video2.mp4" muted playsinline webkit-playsinline preload="auto"></video>
      <video id="video-2" src="video3.mp4" muted playsinline webkit-playsinline preload="auto"></video>
      <video id="video-3" src="video4.mp4" muted playsinline webkit-playsinline preload="auto"></video>
      <video id="video-4" src="video5.mp4" muted playsinline webkit-playsinline preload="auto"></video>
    </a-assets>

    <!--
      ============================================================
      HUD CAROUSEL — locked to the camera viewport
      ============================================================
      The carousel is nested INSIDE <a-camera> so it moves with
      the camera and is never affected by the target image angle.
      Visibility is toggled by JavaScript on targetFound/targetLost.

      All Z coordinates are negative (in front of the lens):
        center  z = -1.50  (base depth)
        left/right z = -1.56  (slight depth for Cover Flow curve)
        far     z = -1.70  (deeper for the cylindrical arc effect)

      Slot table (COVERFLOW_SLOTS in script):
        Slot 0 (far-left):  x=-1.20  z=-1.70  rotY=+65°  scale=0.50
        Slot 1 (left):      x=-0.75  z=-1.56  rotY=+38°  scale=0.70
        Slot 2 (center):    x=  0    z=-1.50  rotY=  0°  scale=1.00  ← active
        Slot 3 (right):     x=+0.75  z=-1.56  rotY=-38°  scale=0.70
        Slot 4 (far-right): x=+1.20  z=-1.70  rotY=-65°  scale=0.50

      Initial mapping (currentIndex=0):
        plane-0  rel=0 → slot 2 (center)
        plane-1  rel=1 → slot 3 (right)
        plane-2  rel=2 → slot 4 (far-right)
        plane-3  rel=3 → slot 0 (far-left)
        plane-4  rel=4 → slot 1 (left)
    -->
    <a-camera position="0 0 0" look-controls="enabled: false">
      <a-entity id="hud-carousel-container" visible="false">

        <!-- Navigation arrows — bracket the center card (half-width ≈ 0.5) -->
        <a-text id="arrow-left"  value="❮" position="-0.62 0 -1.49"
          align="center" color="white" width="3"></a-text>
        <a-text id="arrow-right" value="❯" position=" 0.62 0 -1.49"
          align="center" color="white" width="3"></a-text>

        <!-- plane-0: slot 2 — center (active, full size) -->
        <a-video id="plane-0" src="#video-0" video-texture-fix width="1" height="0.5625"
          position="0 0 -1.50" scale="1 1 1" rotation="0 0 0" visible="false"></a-video>

        <!-- plane-1: slot 3 — right -->
        <a-video id="plane-1" src="#video-1" video-texture-fix width="1" height="0.5625"
          position="0.75 0 -1.56" scale="0.70 0.70 0.70" rotation="0 -38 0" visible="false"></a-video>

        <!-- plane-2: slot 4 — far-right -->
        <a-video id="plane-2" src="#video-2" video-texture-fix width="1" height="0.5625"
          position="1.20 0 -1.70" scale="0.50 0.50 0.50" rotation="0 -65 0" visible="false"></a-video>

        <!-- plane-3: slot 0 — far-left -->
        <a-video id="plane-3" src="#video-3" video-texture-fix width="1" height="0.5625"
          position="-1.20 0 -1.70" scale="0.50 0.50 0.50" rotation="0 65 0" visible="false"></a-video>

        <!-- plane-4: slot 1 — left -->
        <a-video id="plane-4" src="#video-4" video-texture-fix width="1" height="0.5625"
          position="-0.75 0 -1.56" scale="0.70 0.70 0.70" rotation="0 38 0" visible="false"></a-video>

      </a-entity>
    </a-camera>

    <!-- Target entity kept empty — only needed to fire targetFound/targetLost events. -->
    <a-entity mindar-image-target="targetIndex: 0"></a-entity>
  </a-scene>

    const VIDEO_COUNT      = 5;   // update if you add or remove videos
    const SWIPE_THRESHOLD  = 50;  // minimum px horizontal movement to count as a swipe


    // ============================================================

    // ============================================================

    // Detect the best matching language from the browser/OS setting.
    // Returns a key that exists in TRANSLATIONS (falls back to 'en').
    function detectLanguage() {
      var raw = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      // Traditional Chinese must be checked before generic 'zh'.
      if (raw === 'zh-tw' || raw === 'zh-hk' || raw.indexOf('hant') !== -1) return 'zh-TW';
      if (raw.startsWith('zh')) return 'zh';
      var base = raw.substring(0, 2);
      return TRANSLATIONS[base] ? base : 'en';
    }

    // Apply translations to all UI text elements.
    // Returns the active translation object so callers can reuse strings
    // (e.g. the "Starting…" label used by the button click handler).
    function applyTranslations() {
      var lang = detectLanguage();
      var t    = TRANSLATIONS[lang];

      document.getElementById('start-btn').textContent = t.start;

      // subtitle uses '\n' for the line break inside the <p> tag
      var p = document.querySelector('#loading p');
      p.innerHTML = t.subtitle.replace('\n', '<br>');

      document.getElementById('swipe-hint').textContent  = t.swipe;
      document.getElementById('scan-title').textContent   = t.scanTitle;
      document.getElementById('scan-subtitle').textContent = t.scanSubtitle;

      // RTL layout for Arabic
      if (t.rtl) {
        document.getElementById('loading').setAttribute('dir', 'rtl');
        document.getElementById('scan-instruction').setAttribute('dir', 'rtl');
      }

      return t; // returned so the start-button handler can use t.starting
    }


    // ============================================================
    // STARTUP
    // ============================================================
    window.addEventListener('DOMContentLoaded', function () {
      const sceneEl        = document.querySelector('a-scene');
      const loadingEl      = document.getElementById('loading');
      const hintEl         = document.getElementById('swipe-hint');
      const dotEl          = document.getElementById('dot-indicator');
      const hudContainer   = document.getElementById('hud-carousel-container');
      const scanEl         = document.getElementById('scan-instruction');

      // Apply language immediately — before anything else is shown.
      var t = applyTranslations();

      // Capture AR system once A-Frame is ready, but don't start yet.
      // We wait for the user's tap so iOS accepts audio + camera together.
      let arSystem = null;
      sceneEl.addEventListener('loaded', function () {
        arSystem = sceneEl.systems['mindar-image-system'];
      });

      // When the camera is live: hide the start-gate and show the
      // scanning instruction so the user knows what to point at.
      sceneEl.addEventListener('arReady', function () {
        loadingEl.style.display = 'none';
        scanEl.classList.add('visible');
      });


      // ============================================================
      // CAROUSEL STATE
      // ============================================================
      let currentIndex    = 0;
      let isMarkerVisible = false;
      let hintShown       = false;
      let isAnimating     = false; // blocks swipes during a flip transition

      const videos = [
        document.getElementById('video-0'),
        document.getElementById('video-1'),
        document.getElementById('video-2'),
        document.getElementById('video-3'),
        document.getElementById('video-4'),
      ];

      const planes = [
        document.getElementById('plane-0'),
        document.getElementById('plane-1'),
        document.getElementById('plane-2'),
        document.getElementById('plane-3'),
        document.getElementById('plane-4'),
      ];

      const dots = Array.from(document.querySelectorAll('.dot'));


      // ============================================================
      // DYNAMIC ASPECT RATIOS
      // ============================================================
      // Defaults to 16:9; overwritten as each video's metadata loads.
      const aspectRatios = [16/9, 16/9, 16/9, 16/9, 16/9];

      videos.forEach(function (vid, i) {
        vid.addEventListener('loadedmetadata', function () {
          if (vid.videoWidth && vid.videoHeight) {
            aspectRatios[i] = vid.videoWidth / vid.videoHeight;
          }
        });
      });

      function getPlaneHeight(index) {
        return 1 / aspectRatios[index]; // width is always 1 AR unit
      }


      // ============================================================
      // 3D INDICATOR ELEMENTS
      // ============================================================
      const arrowLeft  = document.getElementById('arrow-left');
      const arrowRight = document.getElementById('arrow-right');

      // Show or hide the floating navigation arrows.
      function setIndicatorsVisible(show) {
        arrowLeft.setAttribute('visible', show);
        arrowRight.setAttribute('visible', show);
      }


      // ============================================================
      // HUD COVER FLOW CAROUSEL
      // ============================================================
      // Planes are children of <a-camera> so they are locked to the
      // screen and never affected by the target image angle.
      //
      // Z coordinates are negative (in front of the camera lens):
      //   center  z = -1.50    adjacent z = -1.56    far z = -1.70
      //
      // To tune: edit COVERFLOW_SLOTS.
      //   x  = horizontal offset in camera space (0 = screen center)
      //   z  = depth in front of lens (all negative)
      //   ry = Y-axis inward tilt for the Cover Flow curve effect
      //   sx = uniform scale  (center = 1.0 = ~70% of screen width)

      var ANIM_MS = 500;
      var Y_BASE  = 0;    // vertical offset in camera space (0 = screen center)

      var COVERFLOW_SLOTS = [
        { x: -1.20, z: -1.70, ry:  65, sx: 0.50 }, // 0: far-left
        { x: -0.75, z: -1.56, ry:  38, sx: 0.70 }, // 1: left
        { x:  0,    z: -1.50, ry:   0, sx: 1.00 }, // 2: center (full size, facing camera)
        { x:  0.75, z: -1.56, ry: -38, sx: 0.70 }, // 3: right
        { x:  1.20, z: -1.70, ry: -65, sx: 0.50 }, // 4: far-right
      ];

      // Maps a video index to its current slot (0–4).
      //   relative 0 → slot 2 (active center)
      //   relative 1 → slot 3 (right)      relative 4 → slot 1 (left)
      //   relative 2 → slot 4 (far-right)  relative 3 → slot 0 (far-left)
      function getSlotIndex(videoIdx) {
        var rel = (videoIdx - currentIndex + VIDEO_COUNT) % VIDEO_COUNT;
        return (rel + 2) % VIDEO_COUNT;
      }

      // Apply a slot's transform (position, scale, rotation, height) to a plane.
      // In HUD/camera space all planes animate rotation normally — the center
      // slot has ry=0 so it naturally faces forward, no special handling needed.
      //
      // height — the plane's correct aspect-ratio height (videoH/videoW).
      //          Animated alongside scale so the card zooms in/out undistorted.
      //          Pass undefined to leave height unchanged.
      function applySlot(plane, slotIdx, animate, height) {
        var s      = COVERFLOW_SLOTS[slotIdx];
        var posStr = s.x + ' ' + Y_BASE + ' ' + s.z;
        var rotStr = '0 ' + s.ry + ' 0';
        var scaStr = s.sx + ' ' + s.sx + ' ' + s.sx;

        if (animate) {
          plane.setAttribute('animation__pos',   { property: 'position', to: posStr, dur: ANIM_MS, easing: 'easeInOutCubic' });
          plane.setAttribute('animation__rot',   { property: 'rotation', to: rotStr, dur: ANIM_MS, easing: 'easeInOutCubic' });
          plane.setAttribute('animation__scale', { property: 'scale',    to: scaStr, dur: ANIM_MS, easing: 'easeInOutCubic' });
          if (height !== undefined) {
            plane.setAttribute('animation__height', { property: 'height', to: height, dur: ANIM_MS, easing: 'easeInOutCubic' });
          }
        } else {
          plane.setAttribute('position', posStr);
          plane.setAttribute('rotation', rotStr);
          plane.setAttribute('scale',    scaStr);
          if (height !== undefined) {
            plane.setAttribute('height', height);
          }
        }
      }

      // Snap all planes to their current slots instantly and make them visible.
      function updateLayout() {
        planes.forEach(function (plane, i) {
          applySlot(plane, getSlotIndex(i), false, getPlaneHeight(i));
          plane.setAttribute('visible', true);
        });
        dots.forEach(function (d, i) {
          d.classList.toggle('active', i === currentIndex);
        });
      }

      // Cancel all in-progress animations and hide every plane.
      function resetAllPlanes() {
        planes.forEach(function (p) {
          p.removeAttribute('animation__pos');
          p.removeAttribute('animation__rot');
          p.removeAttribute('animation__scale');
          p.removeAttribute('animation__height');
          p.setAttribute('visible', false);
        });
      }



      // ============================================================
      // TAP-TO-START — iOS AUDIO UNLOCK
      // ============================================================
      // iOS Safari requires video.play() inside a user-gesture handler
      // to "unlock" the audio pipeline. The videos must be MUTED during
      // this unlock call — that is the iOS requirement. Audio is enabled
      // (muted = false) separately, right before each actual playback.
      const startBtn = document.getElementById('start-btn');
      startBtn.addEventListener('click', function () {
        startBtn.disabled = true;
        startBtn.textContent = t.starting; // translated "Starting…"

        // Unlock all videos for unmuted playback while inside the gesture.
        // iOS authorises future play() calls based on the muted state used here,
        // so we must set muted=false NOW (in the gesture) to allow unmuted play later.
        videos.forEach(function (v) {
          v.muted = false;
          v.play().catch(function () {});
          v.pause();
          v.currentTime = 0;
        });

        // Start the AR camera (also benefits from being in a gesture handler).
        if (arSystem) {
          arSystem.start();
        } else {
          sceneEl.addEventListener('loaded', function () {
            sceneEl.systems['mindar-image-system'].start();
          });
        }
      });


      // ============================================================
      // AUTO-ADVANCE PLAYLIST
      // ============================================================
      // 'ended' fires when a video plays to completion (loop is absent).
      videos.forEach(function (vid) {
        vid.addEventListener('ended', function () {
          if (!isMarkerVisible) return;
          switchVideo(+1);
        });
      });


      // ============================================================
      // SWITCH VIDEO — Cover Flow slide transition
      // ============================================================
      // Swipe left  (+1): arc flows left  → next video comes to center.
      // Swipe right (-1): arc flows right → prev video comes to center.
      // ALL 5 planes animate to their new slots simultaneously.
      function switchVideo(direction) {
        if (!isMarkerVisible || isAnimating) return;
        isAnimating = true;

        // Pause and rewind the outgoing video.
        videos[currentIndex].pause();
        videos[currentIndex].currentTime = 0;

        // Advance the active index.
        currentIndex = (currentIndex + direction + VIDEO_COUNT) % VIDEO_COUNT;

        // Animate ALL planes to their new HUD slots simultaneously.
        // Rotation animates smoothly: incoming center tilts from ±38° → 0°,
        // outgoing center tilts from 0° → ±38°, creating the Cover Flow flow.
        planes.forEach(function (plane, i) {
          applySlot(plane, getSlotIndex(i), true, getPlaneHeight(i));
        });

        // Update dot indicator.
        dots.forEach(function (d, i) {
          d.classList.toggle('active', i === currentIndex);
        });

        // Play the newly centered video (already unmuted from the start-gesture unlock).
        videos[currentIndex].play();

        setTimeout(function () { isAnimating = false; }, ANIM_MS + 50);
      }


      // ============================================================
      // AR TRACKING EVENTS
      // ============================================================
      const target = document.querySelector('[mindar-image-target]');

      target.addEventListener('targetFound', function () {
        isMarkerVisible = true;
        isAnimating     = false;

        // Dismiss the scanning instruction overlay on first detection.
        scanEl.classList.remove('visible');

        // Make the HUD carousel visible and snap all planes to their slots.
        hudContainer.setAttribute('visible', 'true');
        resetAllPlanes();
        updateLayout();
        setIndicatorsVisible(true);
        dotEl.classList.add('visible');

        // Play active video (already unmuted from the start-gesture unlock).
        videos[currentIndex].play();

        if (!hintShown) {
          hintShown = true;
          hintEl.classList.add('visible');
          setTimeout(function () { hintEl.classList.remove('visible'); }, 3000);
        }
      });

      target.addEventListener('targetLost', function () {
        isMarkerVisible = false;
        isAnimating     = false;

        // Pause and rewind the active video, then hide the entire HUD.
        videos[currentIndex].pause();
        videos[currentIndex].currentTime = 0;
        hudContainer.setAttribute('visible', 'false');
        resetAllPlanes();
        setIndicatorsVisible(false);
        dotEl.classList.remove('visible');

        // Re-show the scanning instruction so the user knows to
        // point the camera back at the target image.
        scanEl.classList.add('visible');
      });


      // ============================================================
      // SWIPE GESTURE DETECTION
      // ============================================================
      let touchStartX = 0;

      document.addEventListener('touchstart', function (e) {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      document.addEventListener('touchend', function (e) {
        var delta = e.changedTouches[0].screenX - touchStartX;
        if      (delta < -SWIPE_THRESHOLD) switchVideo(+1); // swipe left  → next
        else if (delta >  SWIPE_THRESHOLD) switchVideo(-1); // swipe right → prev
      }, { passive: true });

    }); // end DOMContentLoaded
  </script>
</body>
</html>
