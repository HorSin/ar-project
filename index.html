<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Makes the page scale correctly on mobile phones. REQUIRED for AR. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>My First WebAR</title>

  <!--
    ============================================================
    1) LOAD THE TWO FREE LIBRARIES (from a free public CDN)
    ============================================================
    - A-Frame: makes it easy to put 3D / 2D things on a web page.
    - MindAR:  watches the camera and detects your target photo.
    You do NOT need to download these. The browser fetches them.
  -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* Make the AR view fill the whole screen with no scrollbars. */
    /* touch-action: none prevents iOS pull-to-refresh and Android back-swipe
       from firing during horizontal swipes on the AR canvas. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; }

    /* Full-screen overlay shown on launch. Acts as both the start gate
       and the iOS media-unlock trigger (video must be touched by a real
       user gesture before Safari will let it play). */
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 32px;
      background: #000; color: #fff; font-family: sans-serif;
      text-align: center; z-index: 9999; padding: 24px;
      box-sizing: border-box;
    }
    #loading p { margin: 0; font-size: 16px; opacity: 0.7; line-height: 1.5; }
    /* The tap-to-start button that doubles as the iOS media-unlock gesture. */
    #start-btn {
      background: #fff; color: #000; border: none;
      padding: 16px 48px; font-size: 20px; font-weight: bold;
      border-radius: 50px; font-family: sans-serif; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #start-btn:disabled { opacity: 0.5; }

    /* Swipe hint shown briefly after the AR target is first found. */
    #swipe-hint {
      position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55); color: #fff; font-family: sans-serif;
      font-size: 14px; padding: 8px 18px; border-radius: 20px;
      pointer-events: none; z-index: 9998;
      opacity: 0; transition: opacity 0.4s;
    }
    #swipe-hint.visible { opacity: 1; }
  </style>
</head>

<body>
  <!-- Start-gate overlay. The button tap is the iOS media-unlock gesture.
       Without this user-initiated tap, Safari will silently refuse to play
       any video, leaving a black rectangle on the AR plane. -->
  <div id="loading">
    <button id="start-btn">Tap to Start AR</button>
    <p>Point your camera at<br>your target photo after tapping.</p>
  </div>

  <!-- Brief swipe hint shown after first target detection. -->
  <div id="swipe-hint">← Swipe to browse videos →</div>

  <!--
    ============================================================
    THE AR SCENE
    ============================================================
    mindar-image="imageTargetSrc: targets.mind;"
       -> tells MindAR which tracking file to use (you create this in Step 1).
    autoStart: false
       -> we start it manually after the page loads (more reliable on iPhone).
    color-space, device-orientation, etc. are sensible defaults; leave them.
  -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- timeout="30000": give mobile browsers 30s to buffer all 5 videos
         before A-Frame declares the assets failed (default is only 3s). -->
    <a-assets timeout="30000">
      <!--
        ============================================================
        VIDEO CAROUSEL ASSETS
        ============================================================
        Add one <video> per carousel slide.
        - Replace the src filenames with your own .mp4 files.
        - All files must be in the SAME FOLDER as index.html.
        - playsinline is REQUIRED for iOS/Android — keep it on every tag.
        - Audio is ON (no muted attribute). The "Tap to Start" button
          unlocks audio on iOS. Do NOT add muted back or audio will be lost.
        - preload="auto" asks the browser to buffer all videos up front
          so swipe transitions feel instant.

        To add more slides: duplicate a <video> tag here AND add a
        matching <a-video> plane in the scene below.

        NOTE: 'loop' is intentionally OMITTED on all videos. This allows
        the browser to fire the 'ended' event so the carousel can
        auto-advance to the next slide when a video finishes playing.
      -->
      <video id="video-0" src="video1.mp4"  playsinline webkit-playsinline preload="auto"></video>
      <video id="video-1" src="video2.mp4"  playsinline webkit-playsinline preload="auto"></video>
      <video id="video-2" src="video3.mp4"  playsinline webkit-playsinline preload="auto"></video>
      <video id="video-3" src="video4.mp4"  playsinline webkit-playsinline preload="auto"></video>
      <video id="video-4" src="video5.mp4"  playsinline webkit-playsinline preload="auto"></video>
    </a-assets>

    <!-- A camera is required. Leave these settings as-is. -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!--
      ============================================================
      THE TARGET + WHAT APPEARS ON IT
      ============================================================
      An <a-entity mindar-image-target="targetIndex: 0"> is the
      "anchor" for the FIRST image inside your targets.mind file.
      Anything you put INSIDE it will float on top of that photo,
      and disappear when the photo leaves the camera view.

      The target is treated as 1 unit wide. So:
        width = 1   -> same width as your photo
        height = ?  -> match your photo's shape (e.g. 0.55 for landscape)
    -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- ===== VIDEO CAROUSEL PLANES ===== -->
      <!--
        All five planes sit at the EXACT same 3D position. Only the
        active one is visible at any time. The JavaScript below controls
        which one is shown via the 'visible' attribute.

        To change the video size or position, edit width/height/position
        on ALL five planes so they stay in sync.

        To add a 6th slide: add <a-video id="plane-5" src="#video-5" ...
        visible="false"> here AND update VIDEO_COUNT in the script below.
      -->
      <a-video
        id="plane-0"
        src="#video-0"
        width="1"
        height="0.5625"
        position="0 0.7 0"
        visible="false">
      </a-video>

      <a-video
        id="plane-1"
        src="#video-1"
        width="1"
        height="0.5625"
        position="0 0.7 0"
        visible="false">
      </a-video>

      <a-video
        id="plane-2"
        src="#video-2"
        width="1"
        height="0.5625"
        position="0 0.7 0"
        visible="false">
      </a-video>

      <a-video
        id="plane-3"
        src="#video-3"
        width="1"
        height="0.5625"
        position="0 0.7 0"
        visible="false">
      </a-video>

      <a-video
        id="plane-4"
        src="#video-4"
        width="1"
        height="0.5625"
        position="0 0.7 0"
        visible="false">
      </a-video>

    </a-entity>
  </a-scene>

  <script>
    // ============================================================
    // CAROUSEL CONFIGURATION
    // ============================================================
    // If you add or remove videos, update this number to match.
    const VIDEO_COUNT = 5;

    // Minimum horizontal distance (px) a touch must travel to count as a swipe.
    const SWIPE_THRESHOLD = 50;

    // Horizontal distance (AR units) between plane centres for the peek effect.
    // The active plane sits at x=0; neighbours sit at ±PEEK_OFFSET.
    // With width=1 and PEEK_OFFSET=1.1 there is a 0.1-unit gap between planes,
    // and roughly half of each neighbour sticks out past the target's edge.
    const PEEK_OFFSET = 1.1;


    // ============================================================
    // START THE CAMERA AFTER THE PAGE IS READY
    // ============================================================
    window.addEventListener('DOMContentLoaded', function () {
      const sceneEl   = document.querySelector('a-scene');
      const loadingEl = document.getElementById('loading');
      const hintEl    = document.getElementById('swipe-hint');

      // ---- Capture the AR system reference once A-Frame is loaded ----
      // We do NOT start it yet — we wait for the user's tap so that
      // iOS will also allow video playback (same gesture, same context).
      let arSystem = null;
      sceneEl.addEventListener('loaded', function () {
        arSystem = sceneEl.systems['mindar-image-system'];
      });

      // ---- Hide the loading overlay once the camera is running ----
      sceneEl.addEventListener('arReady', function () {
        loadingEl.style.display = 'none';
      });

      // ============================================================
      // TAP-TO-START  —  iOS VIDEO UNLOCK
      // ============================================================
      // iOS Safari requires that video.play() be called synchronously
      // inside a user-gesture handler (touch / click) the FIRST time.
      // We play-then-immediately-pause all 5 videos here so Safari marks
      // them as "user-approved". After this, every subsequent .play()
      // call (from targetFound, switchVideo, etc.) will work without
      // needing another gesture.
      const startBtn = document.getElementById('start-btn');
      startBtn.addEventListener('click', function () {
        // Disable the button immediately to prevent double-taps.
        startBtn.disabled = true;
        startBtn.textContent = 'Starting…';

        // iOS unlock: touch every video inside this user-gesture handler.
        // Setting muted=false before play() is what tells iOS to allow audio.
        videos.forEach(function (v) {
          v.muted = false;
          v.play().catch(function () {});
          v.pause();
          v.currentTime = 0;
        });

        // Now start the AR camera. The camera itself also benefits from
        // being triggered inside a user gesture on some iOS versions.
        if (arSystem) {
          arSystem.start();
        } else {
          // A-Frame hasn't fired 'loaded' yet — wait for it, then start.
          sceneEl.addEventListener('loaded', function () {
            sceneEl.systems['mindar-image-system'].start();
          });
        }
      });


      // ============================================================
      // CAROUSEL STATE
      // ============================================================
      let currentIndex    = 0;     // which video/plane is currently active
      let isMarkerVisible = false; // true only while the image target is detected
      let hintShown       = false; // show the swipe hint only once per session

      // Grab all video elements and all A-Frame plane entities.
      const videos = [
        document.getElementById('video-0'),
        document.getElementById('video-1'),
        document.getElementById('video-2'),
        document.getElementById('video-3'),
        document.getElementById('video-4'),
      ];

      const planes = [
        document.getElementById('plane-0'),
        document.getElementById('plane-1'),
        document.getElementById('plane-2'),
        document.getElementById('plane-3'),
        document.getElementById('plane-4'),
      ];


      // ============================================================
      // DYNAMIC ASPECT RATIOS
      // ============================================================
      // Pre-filled with 16:9 as a safe default. Each slot is overwritten
      // as soon as the browser has parsed that video's metadata.
      const aspectRatios = [16/9, 16/9, 16/9, 16/9, 16/9];

      videos.forEach(function (vid, i) {
        vid.addEventListener('loadedmetadata', function () {
          if (vid.videoWidth && vid.videoHeight) {
            aspectRatios[i] = vid.videoWidth / vid.videoHeight;
          }
        });
      });

      // Returns the A-Frame height for a given video index.
      // All planes use width="1", so height = 1 / aspectRatio.
      function getPlaneHeight(index) {
        return 1 / aspectRatios[index];
      }


      // ============================================================
      // LAYOUT UPDATE — positions + visibility for peek carousel
      // ============================================================
      // Called on targetFound and every switchVideo.
      // Shows exactly 3 planes at a time: prev (left peek), current
      // (centre), and next (right peek). All others are hidden.
      function updateLayout() {
        var prevIdx = (currentIndex - 1 + VIDEO_COUNT) % VIDEO_COUNT;
        var nextIdx = (currentIndex + 1) % VIDEO_COUNT;

        // Hide everything first, then selectively show 3.
        planes.forEach(function (p) { p.setAttribute('visible', false); });

        // Previous video — peeking in from the left
        planes[prevIdx].setAttribute('position', (-PEEK_OFFSET) + ' 0.7 0');
        planes[prevIdx].setAttribute('height', getPlaneHeight(prevIdx));
        planes[prevIdx].setAttribute('visible', true);

        // Active video — centred over the target
        planes[currentIndex].setAttribute('position', '0 0.7 0');
        planes[currentIndex].setAttribute('height', getPlaneHeight(currentIndex));
        planes[currentIndex].setAttribute('visible', true);

        // Next video — peeking in from the right
        planes[nextIdx].setAttribute('position', PEEK_OFFSET + ' 0.7 0');
        planes[nextIdx].setAttribute('height', getPlaneHeight(nextIdx));
        planes[nextIdx].setAttribute('visible', true);
      }


      // ============================================================
      // AUTO-ADVANCE PLAYLIST
      // ============================================================
      // Each video fires 'ended' when it plays to the end (only possible
      // because 'loop' is intentionally removed from the <video> tags).
      // We advance to the next slide exactly as if the user swiped left.
      // The isMarkerVisible guard prevents auto-advance from triggering
      // while the target is off-screen (e.g. user looks away mid-video).
      videos.forEach(function (vid) {
        vid.addEventListener('ended', function () {
          if (!isMarkerVisible) return;
          switchVideo(+1);
        });
      });


      // ============================================================
      // SWITCH VIDEO HELPER
      // ============================================================
      // direction: +1 = next (swipe left), -1 = previous (swipe right)
      function switchVideo(direction) {
        // Guard: do nothing if the marker is not currently visible.
        if (!isMarkerVisible) return;

        // Pause and rewind the outgoing video.
        videos[currentIndex].pause();
        videos[currentIndex].currentTime = 0;

        // Advance the index (wraps around seamlessly).
        currentIndex = (currentIndex + direction + VIDEO_COUNT) % VIDEO_COUNT;

        // Reposition all planes and make the right 3 visible.
        updateLayout();

        // Play the new active video.
        videos[currentIndex].play();
      }


      // ============================================================
      // AR TRACKING EVENTS
      // ============================================================
      const target = document.querySelector('[mindar-image-target]');

      // Image target found: position all planes, then play the active video.
      target.addEventListener('targetFound', function () {
        isMarkerVisible = true;
        updateLayout();                    // sets positions + visibility for all 3 slots
        videos[currentIndex].play();

        // Show the swipe hint the very first time the target is detected.
        if (!hintShown) {
          hintShown = true;
          hintEl.classList.add('visible');
          setTimeout(function () { hintEl.classList.remove('visible'); }, 3000);
        }
      });

      // Image target lost: pause the currently active video.
      target.addEventListener('targetLost', function () {
        isMarkerVisible = false;
        videos[currentIndex].pause();
      });


      // ============================================================
      // SWIPE / TOUCH GESTURE DETECTION
      // ============================================================
      // We listen on the whole document so the user can swipe anywhere
      // on the screen, not just on the video itself.
      let touchStartX = 0;

      document.addEventListener('touchstart', function (e) {
        // Record where the finger first touched the screen.
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      document.addEventListener('touchend', function (e) {
        const touchEndX = e.changedTouches[0].screenX;
        const delta = touchEndX - touchStartX;

        if (delta < -SWIPE_THRESHOLD) {
          // Finger moved LEFT → advance to the next video.
          switchVideo(+1);
        } else if (delta > SWIPE_THRESHOLD) {
          // Finger moved RIGHT → go back to the previous video.
          switchVideo(-1);
        }
        // Small movements (< threshold) are ignored to avoid accidental switches.
      }, { passive: true });

    }); // end DOMContentLoaded
  </script>
</body>
</html>
