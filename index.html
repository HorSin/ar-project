<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>My First WebAR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* touch-action: none prevents iOS pull-to-refresh / Android back-swipe during swipes. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; }

    /* ---- Start-gate overlay ---- */
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 32px;
      background: #000; color: #fff; font-family: sans-serif;
      text-align: center; z-index: 9999; padding: 24px; box-sizing: border-box;
    }
    #loading p { margin: 0; font-size: 16px; opacity: 0.7; line-height: 1.5; }

    /* The tap-to-start button is ALSO the iOS audio-unlock gesture. */
    #start-btn {
      background: #fff; color: #000; border: none;
      padding: 16px 48px; font-size: 20px; font-weight: bold;
      border-radius: 50px; font-family: sans-serif; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #start-btn:disabled { opacity: 0.5; }

    /* ---- Swipe hint (fades in once on first target detection) ---- */
    #swipe-hint {
      position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55); color: #fff; font-family: sans-serif;
      font-size: 14px; padding: 8px 18px; border-radius: 20px;
      pointer-events: none; z-index: 9998; opacity: 0; transition: opacity 0.4s;
    }
    #swipe-hint.visible { opacity: 1; }

    /* ---- Dot indicator — shows which video is active ---- */
    #dot-indicator {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: none; gap: 10px; z-index: 9997; pointer-events: none;
    }
    #dot-indicator.visible { display: flex; }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: rgba(255,255,255,0.35); transition: background 0.3s;
    }
    .dot.active { background: #fff; transform: scale(1.25); }
  </style>
</head>

<body>
  <!-- Start-gate overlay. The button tap unlocks iOS audio AND camera. -->
  <div id="loading">
    <button id="start-btn">Tap to Start AR</button>
    <p>Point your camera at<br>your target photo after tapping.</p>
  </div>

  <!-- Swipe hint shown briefly on first target detection. -->
  <div id="swipe-hint">← Swipe to browse videos →</div>

  <!-- Dot indicator — one dot per video, shown once AR is tracking. -->
  <div id="dot-indicator">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- timeout="30000": gives slow mobile connections 30 s to buffer 5 videos. -->
    <a-assets timeout="30000">
      <!--
        VIDEO CAROUSEL ASSETS
        ============================================================
        - Replace src filenames with your own .mp4 files.
        - Keep ALL attributes as-is: muted is required for the iOS
          audio-unlock step; it is removed automatically right before
          actual playback by the JavaScript below.
        - loop is intentionally OMITTED so the 'ended' event fires and
          the carousel can auto-advance to the next video.
      -->
      <video id="video-0" src="video1.mp4" muted playsinline webkit-playsinline preload="auto"></video>
      <video id="video-1" src="video2.mp4" muted playsinline webkit-playsinline preload="auto"></video>
      <video id="video-2" src="video3.mp4" muted playsinline webkit-playsinline preload="auto"></video>
      <video id="video-3" src="video4.mp4" muted playsinline webkit-playsinline preload="auto"></video>
      <video id="video-4" src="video5.mp4" muted playsinline webkit-playsinline preload="auto"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <!-- ===== 3D NAVIGATION ARROWS ===== -->
      <!--
        Floating chevron characters on either side of the active video.
        They tell the user they can swipe left or right.
        Shown when the target is found; hidden when it is lost.
      -->
      <a-text id="arrow-left"
        value="❮"
        position="-0.65 0.7 0.05"
        align="center" color="white"
        width="3" visible="false">
      </a-text>

      <a-text id="arrow-right"
        value="❯"
        position="0.65 0.7 0.05"
        align="center" color="white"
        width="3" visible="false">
      </a-text>

      <!-- ===== VIDEO CAROUSEL PLANES ===== -->
      <!--
        All five planes share the same position. Only the active one is
        visible at a time. JavaScript controls visibility via updateLayout().
        To add a 6th video: duplicate a plane here and update VIDEO_COUNT.
      -->
      <a-video id="plane-0" src="#video-0" width="1" height="3" position="0 0.7 0" visible="false"></a-video>
      <a-video id="plane-1" src="#video-1" width="1" height="3" position="0 0.7 0" visible="false"></a-video>
      <a-video id="plane-2" src="#video-2" width="1" height="3" position="0 0.7 0" visible="false"></a-video>
      <a-video id="plane-3" src="#video-3" width="1" height="3" position="0 0.7 0" visible="false"></a-video>
      <a-video id="plane-4" src="#video-4" width="1" height="3" position="0 0.7 0" visible="false"></a-video>

    </a-entity>
  </a-scene>

  <script>
    // ============================================================
    // CAROUSEL CONFIGURATION
    // ============================================================
    const VIDEO_COUNT      = 5;   // update if you add or remove videos
    const SWIPE_THRESHOLD  = 50;  // minimum px horizontal movement to count as a swipe


    // ============================================================
    // TRANSLATIONS
    // ============================================================
    // UI strings for every supported language.
    // To add a new language: copy the 'en' block, change the key to
    // the ISO 639-1 code (e.g. 'fr'), and fill in the translated strings.
    const TRANSLATIONS = {
      en: {
        start:    'Tap to Start AR',
        subtitle: 'Point your camera at\nyour target photo after tapping.',
        starting: 'Starting…',
        swipe:    '← Swipe to browse videos →'
      },
      // ── Chinese Simplified ──
      zh: {
        start:    '点击开始 AR',
        subtitle: '点击后，将相机对准您的目标图片。',
        starting: '启动中…',
        swipe:    '← 滑动浏览视频 →'
      },
      // ── Chinese Traditional ──
      'zh-TW': {
        start:    '點擊開始 AR',
        subtitle: '點擊後，將相機對準您的目標圖片。',
        starting: '啟動中…',
        swipe:    '← 滑動瀏覽影片 →'
      },
      // ── Malay ──
      ms: {
        start:    'Ketuk untuk Mulakan AR',
        subtitle: 'Selepas mengetuk, arahkan\nkamera ke foto sasaran anda.',
        starting: 'Sedang memulakan…',
        swipe:    '← Leret untuk semak video →'
      },
      // ── Tamil ──
      ta: {
        start:    'AR தொடங்க தட்டவும்',
        subtitle: 'தட்டிய பிறகு, கேமராவை இலக்கு படத்தில் செலுத்துங்கள்.',
        starting: 'தொடங்குகிறது…',
        swipe:    '← வீடியோக்களை ஸ்வைப் செய்யுங்கள் →'
      },
      // ── Indonesian ──
      id: {
        start:    'Ketuk untuk Mulai AR',
        subtitle: 'Setelah mengetuk, arahkan\nkamera ke foto target.',
        starting: 'Memulai…',
        swipe:    '← Geser untuk lihat video →'
      },
      // ── Japanese ──
      ja: {
        start:    'タップしてARを開始',
        subtitle: 'タップ後、カメラをターゲット写真に向けてください。',
        starting: '起動中…',
        swipe:    '← スワイプして動画を見る →'
      },
      // ── Korean ──
      ko: {
        start:    'AR을 시작하려면 탭하세요',
        subtitle: '탭한 후 카메라를 대상 사진에 향하세요.',
        starting: '시작 중…',
        swipe:    '← 스와이프하여 동영상 탐색 →'
      },
      // ── Thai ──
      th: {
        start:    'แตะเพื่อเริ่ม AR',
        subtitle: 'หลังจากแตะ ชี้กล้องไปที่รูปเป้าหมาย',
        starting: 'กำลังเริ่ม…',
        swipe:    '← เลื่อนเพื่อดูวิดีโอ →'
      },
      // ── Arabic (RTL) ──
      ar: {
        start:    'اضغط لبدء AR',
        subtitle: 'بعد الضغط، وجّه الكاميرا نحو الصورة المستهدفة.',
        starting: 'جارٍ البدء…',
        swipe:    '→ اسحب للتصفح ←',
        rtl: true
      },
      // ── French ──
      fr: {
        start:    'Appuyer pour démarrer AR',
        subtitle: 'Après avoir appuyé, pointez\nla caméra vers la photo cible.',
        starting: 'Démarrage…',
        swipe:    '← Glisser pour parcourir les vidéos →'
      },
      // ── Spanish ──
      es: {
        start:    'Toca para iniciar AR',
        subtitle: 'Después de tocar, apunta tu\ncámara a la foto objetivo.',
        starting: 'Iniciando…',
        swipe:    '← Desliza para explorar los videos →'
      },
      // ── German ──
      de: {
        start:    'Tippen zum AR starten',
        subtitle: 'Nach dem Tippen, Kamera\nauf das Zielfoto richten.',
        starting: 'Starte…',
        swipe:    '← Wischen um Videos zu durchsuchen →'
      },
      // ── Portuguese ──
      pt: {
        start:    'Toque para iniciar AR',
        subtitle: 'Após tocar, aponte sua\ncâmera para a foto alvo.',
        starting: 'Iniciando…',
        swipe:    '← Deslize para navegar nos vídeos →'
      },
      // ── Hindi ──
      hi: {
        start:    'AR शुरू करने के लिए टैप करें',
        subtitle: 'टैप करने के बाद, कैमरे को लक्ष्य फ़ोटो की ओर करें।',
        starting: 'शुरू हो रहा है…',
        swipe:    '← वीडियो देखने के लिए स्वाइप करें →'
      }
    };

    // Detect the best matching language from the browser/OS setting.
    // Returns a key that exists in TRANSLATIONS (falls back to 'en').
    function detectLanguage() {
      var raw = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      // Traditional Chinese must be checked before generic 'zh'.
      if (raw === 'zh-tw' || raw === 'zh-hk' || raw.indexOf('hant') !== -1) return 'zh-TW';
      if (raw.startsWith('zh')) return 'zh';
      var base = raw.substring(0, 2);
      return TRANSLATIONS[base] ? base : 'en';
    }

    // Apply translations to all UI text elements.
    // Returns the active translation object so callers can reuse strings
    // (e.g. the "Starting…" label used by the button click handler).
    function applyTranslations() {
      var lang = detectLanguage();
      var t    = TRANSLATIONS[lang];

      document.getElementById('start-btn').textContent = t.start;

      // subtitle uses '\n' for the line break inside the <p> tag
      var p = document.querySelector('#loading p');
      p.innerHTML = t.subtitle.replace('\n', '<br>');

      document.getElementById('swipe-hint').textContent = t.swipe;

      // RTL layout for Arabic
      if (t.rtl) {
        document.getElementById('loading').setAttribute('dir', 'rtl');
      }

      return t; // returned so the start-button handler can use t.starting
    }


    // ============================================================
    // STARTUP
    // ============================================================
    window.addEventListener('DOMContentLoaded', function () {
      const sceneEl   = document.querySelector('a-scene');
      const loadingEl = document.getElementById('loading');
      const hintEl    = document.getElementById('swipe-hint');
      const dotEl     = document.getElementById('dot-indicator');

      // Apply language immediately — before anything else is shown.
      var t = applyTranslations();

      // Capture AR system once A-Frame is ready, but don't start yet.
      // We wait for the user's tap so iOS accepts audio + camera together.
      let arSystem = null;
      sceneEl.addEventListener('loaded', function () {
        arSystem = sceneEl.systems['mindar-image-system'];
      });

      sceneEl.addEventListener('arReady', function () {
        loadingEl.style.display = 'none';
      });


      // ============================================================
      // CAROUSEL STATE
      // ============================================================
      let currentIndex    = 0;
      let isMarkerVisible = false;
      let hintShown       = false;
      let isAnimating     = false; // blocks swipes during a flip transition

      const videos = [
        document.getElementById('video-0'),
        document.getElementById('video-1'),
        document.getElementById('video-2'),
        document.getElementById('video-3'),
        document.getElementById('video-4'),
      ];

      const planes = [
        document.getElementById('plane-0'),
        document.getElementById('plane-1'),
        document.getElementById('plane-2'),
        document.getElementById('plane-3'),
        document.getElementById('plane-4'),
      ];

      const dots = Array.from(document.querySelectorAll('.dot'));


      // ============================================================
      // DYNAMIC ASPECT RATIOS
      // ============================================================
      // Defaults to 16:9; overwritten as each video's metadata loads.
      const aspectRatios = [16/9, 16/9, 16/9, 16/9, 16/9];

      videos.forEach(function (vid, i) {
        vid.addEventListener('loadedmetadata', function () {
          if (vid.videoWidth && vid.videoHeight) {
            aspectRatios[i] = vid.videoWidth / vid.videoHeight;
          }
        });
      });

      function getPlaneHeight(index) {
        return 1 / aspectRatios[index]; // width is always 1 AR unit
      }


      // ============================================================
      // 3D INDICATOR ELEMENTS
      // ============================================================
      const arrowLeft  = document.getElementById('arrow-left');
      const arrowRight = document.getElementById('arrow-right');

      // Show or hide the floating navigation arrows.
      function setIndicatorsVisible(show) {
        arrowLeft.setAttribute('visible', show);
        arrowRight.setAttribute('visible', show);
      }


      // ============================================================
      // 3D FLOATING ARC CAROUSEL
      // ============================================================
      // All 5 videos float simultaneously in an arc around the target.
      // Slot 2 = active (center, full-size, facing camera).
      // Slots 1/3 = adjacent (smaller, angled ±42° on Y).
      // Slots 0/4 = far edges (smallest, angled ±65° on Y, most depth).
      //
      // On every swipe, ALL planes animate together to their next slot,
      // so the whole arc "rolls" around the target as a single unit.

      var ANIM_MS = 420;   // ms for the full arc-roll transition
      var Y_BASE  = 0.7;   // vertical position shared by all planes

      // Slot layout: [dx, dz, rotY, scale, opacity]
      var SLOTS = [
        { dx: -0.78, dz: -0.07, ry:  65, scale: 0.55, opacity: 0.55 }, // 0: far-left
        { dx: -0.44, dz: -0.03, ry:  42, scale: 0.75, opacity: 0.80 }, // 1: left
        { dx:  0,    dz:  0,    ry:   0, scale: 1.00, opacity: 1.00 }, // 2: active
        { dx:  0.44, dz: -0.03, ry: -42, scale: 0.75, opacity: 0.80 }, // 3: right
        { dx:  0.78, dz: -0.07, ry: -65, scale: 0.55, opacity: 0.55 }, // 4: far-right
      ];

      // Maps a video index to its current physical slot (0-4).
      //   rel 0 → slot 2 (active center)
      //   rel 1 → slot 3 (right)   rel 4 → slot 1 (left)
      //   rel 2 → slot 4 (far-right) rel 3 → slot 0 (far-left)
      function getSlotIndex(videoIdx) {
        var rel = (videoIdx - currentIndex + VIDEO_COUNT) % VIDEO_COUNT;
        return (rel + 2) % VIDEO_COUNT;
      }

      // Apply a slot's transform to a plane — instantly or animated.
      function applySlot(plane, slotIdx, animate) {
        var s        = SLOTS[slotIdx];
        var posStr   = s.dx + ' ' + Y_BASE + ' ' + s.dz;
        var rotStr   = '0 ' + s.ry + ' 0';
        var scaleStr = s.scale + ' ' + s.scale + ' 1';

        if (animate) {
          plane.setAttribute('animation__pos', {
            property: 'position', to: posStr,
            dur: ANIM_MS, easing: 'easeInOutQuad'
          });
          plane.setAttribute('animation__rot', {
            property: 'rotation', to: rotStr,
            dur: ANIM_MS, easing: 'easeInOutQuad'
          });
          plane.setAttribute('animation__scale', {
            property: 'scale', to: scaleStr,
            dur: ANIM_MS, easing: 'easeInOutQuad'
          });
          plane.setAttribute('animation__opacity', {
            property: 'material.opacity', to: s.opacity,
            dur: ANIM_MS, easing: 'easeInOutQuad'
          });
        } else {
          plane.setAttribute('position', posStr);
          plane.setAttribute('rotation', rotStr);
          plane.setAttribute('scale',    scaleStr);
          plane.setAttribute('opacity',  s.opacity);
        }
      }

      // Place all 5 planes in their current slots instantly (no animation).
      // Used on first targetFound and after targetLost recovery.
      function updateLayout() {
        planes.forEach(function (plane, i) {
          applySlot(plane, getSlotIndex(i), false);
          plane.setAttribute('height',  getPlaneHeight(i));
          plane.setAttribute('visible', true);
        });
        dots.forEach(function (d, i) {
          d.classList.toggle('active', i === currentIndex);
        });
      }

      // Cancel all animations and hide every plane (called on targetLost).
      function resetAllPlanes() {
        planes.forEach(function (p) {
          p.removeAttribute('animation__pos');
          p.removeAttribute('animation__rot');
          p.removeAttribute('animation__scale');
          p.removeAttribute('animation__opacity');
          p.setAttribute('rotation', '0 0 0');
          p.setAttribute('scale',    '1 1 1');
          p.setAttribute('opacity',  '1');
          p.setAttribute('visible',  false);
        });
      }


      // ============================================================
      // TAP-TO-START — iOS AUDIO UNLOCK
      // ============================================================
      // iOS Safari requires video.play() inside a user-gesture handler
      // to "unlock" the audio pipeline. The videos must be MUTED during
      // this unlock call — that is the iOS requirement. Audio is enabled
      // (muted = false) separately, right before each actual playback.
      const startBtn = document.getElementById('start-btn');
      startBtn.addEventListener('click', function () {
        startBtn.disabled = true;
        startBtn.textContent = t.starting; // translated "Starting…"

        // Unlock all videos while still muted.
        videos.forEach(function (v) {
          v.play().catch(function () {});
          v.pause();
          v.currentTime = 0;
        });

        // Start the AR camera (also benefits from being in a gesture handler).
        if (arSystem) {
          arSystem.start();
        } else {
          sceneEl.addEventListener('loaded', function () {
            sceneEl.systems['mindar-image-system'].start();
          });
        }
      });


      // ============================================================
      // AUTO-ADVANCE PLAYLIST
      // ============================================================
      // 'ended' fires when a video plays to completion (loop is absent).
      videos.forEach(function (vid) {
        vid.addEventListener('ended', function () {
          if (!isMarkerVisible) return;
          switchVideo(+1);
        });
      });


      // ============================================================
      // SWITCH VIDEO — 3D arc-roll transition
      // ============================================================
      // All 5 planes slide simultaneously to their new slot positions.
      // The whole arc "rolls" around the target in the swipe direction.
      function switchVideo(direction) {
        if (!isMarkerVisible || isAnimating) return;
        isAnimating = true;

        // Pause and rewind the outgoing active video.
        videos[currentIndex].pause();
        videos[currentIndex].currentTime = 0;

        // Advance the active index.
        currentIndex = (currentIndex + direction + VIDEO_COUNT) % VIDEO_COUNT;

        // Animate every plane to its new slot in the arc simultaneously.
        planes.forEach(function (plane, i) {
          applySlot(plane, getSlotIndex(i), true);
        });

        // Keep the newly active plane's height correct.
        planes[currentIndex].setAttribute('height', getPlaneHeight(currentIndex));

        // Update dot indicator.
        dots.forEach(function (d, i) {
          d.classList.toggle('active', i === currentIndex);
        });

        // Start playing the newly active video.
        videos[currentIndex].muted = false;
        videos[currentIndex].play();

        // Unlock swipes once the animation finishes.
        setTimeout(function () { isAnimating = false; }, ANIM_MS + 50);
      }


      // ============================================================
      // AR TRACKING EVENTS
      // ============================================================
      const target = document.querySelector('[mindar-image-target]');

      target.addEventListener('targetFound', function () {
        isMarkerVisible = true;
        isAnimating     = false;

        // Place all 5 planes in their arc slots instantly, then show indicators.
        resetAllPlanes();
        updateLayout();
        setIndicatorsVisible(true);
        dotEl.classList.add('visible');

        videos[currentIndex].muted = false;
        videos[currentIndex].play();

        if (!hintShown) {
          hintShown = true;
          hintEl.classList.add('visible');
          setTimeout(function () { hintEl.classList.remove('visible'); }, 3000);
        }
      });

      target.addEventListener('targetLost', function () {
        isMarkerVisible = false;
        isAnimating     = false; // cancel any in-progress flip
        videos[currentIndex].pause();

        // Reset all planes so no half-rotated plane lingers.
        resetAllPlanes();
        setIndicatorsVisible(false);
        dotEl.classList.remove('visible');
      });


      // ============================================================
      // SWIPE GESTURE DETECTION
      // ============================================================
      let touchStartX = 0;

      document.addEventListener('touchstart', function (e) {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      document.addEventListener('touchend', function (e) {
        var delta = e.changedTouches[0].screenX - touchStartX;
        if      (delta < -SWIPE_THRESHOLD) switchVideo(+1); // swipe left  → next
        else if (delta >  SWIPE_THRESHOLD) switchVideo(-1); // swipe right → prev
      }, { passive: true });

    }); // end DOMContentLoaded
  </script>
</body>
</html>
