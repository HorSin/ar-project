<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>My First WebAR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* touch-action: none prevents iOS pull-to-refresh / Android back-swipe during swipes. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; }

    /* ---- Start-gate overlay ---- */
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 32px;
      background: #000; color: #fff; font-family: sans-serif;
      text-align: center; z-index: 9999; padding: 24px; box-sizing: border-box;
    }
    #loading p { margin: 0; font-size: 16px; opacity: 0.7; line-height: 1.5; }

    /* The tap-to-start button is ALSO the iOS audio-unlock gesture. */
    #start-btn {
      background: #fff; color: #000; border: none;
      padding: 16px 48px; font-size: 20px; font-weight: bold;
      border-radius: 50px; font-family: sans-serif; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    #start-btn:disabled { opacity: 0.5; }

    /* ---- Swipe hint (fades in once on first target detection) ---- */
    #swipe-hint {
      position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55); color: #fff; font-family: sans-serif;
      font-size: 14px; padding: 8px 18px; border-radius: 20px;
      pointer-events: none; z-index: 9998; opacity: 0; transition: opacity 0.4s;
    }
    #swipe-hint.visible { opacity: 1; }

    /* ---- Dot indicator — shows which video is active ---- */
    #dot-indicator {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: none; gap: 10px; z-index: 9997; pointer-events: none;
    }
    #dot-indicator.visible { display: flex; }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: rgba(255,255,255,0.35); transition: background 0.3s;
    }
    .dot.active { background: #fff; transform: scale(1.25); }
  </style>
</head>

<body>
  <!-- Start-gate overlay. The button tap unlocks iOS audio AND camera. -->
  <div id="loading">
    <button id="start-btn">Tap to Start AR</button>
    <p>Point your camera at<br>your target photo after tapping.</p>
  </div>

  <!-- Swipe hint shown briefly on first target detection. -->
  <div id="swipe-hint">← Swipe to browse videos →</div>

  <!-- Dot indicator — one dot per video, shown once AR is tracking. -->
  <div id="dot-indicator">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- timeout="30000": gives slow mobile connections 30 s to buffer 5 videos. -->
    <a-assets timeout="30000">
      <!--
        VIDEO CAROUSEL ASSETS
        ============================================================
        - Replace src filenames with your own .mp4 files.
        - Keep ALL attributes as-is: muted is required for the iOS
          audio-unlock step; it is removed automatically right before
          actual playback by the JavaScript below.
        - loop is intentionally OMITTED so the 'ended' event fires and
          the carousel can auto-advance to the next video.
      -->
      <video id="video-0" src="video1.mp4" muted playsinline webkit-playsinline preload="auto"></video>
      <video id="video-1" src="video2.mp4" muted playsinline webkit-playsinline preload="auto"></video>
      <video id="video-2" src="video3.mp4" muted playsinline webkit-playsinline preload="auto"></video>
      <video id="video-3" src="video4.mp4" muted playsinline webkit-playsinline preload="auto"></video>
      <video id="video-4" src="video5.mp4" muted playsinline webkit-playsinline preload="auto"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <!-- ===== 3D DEPTH CUE: DECK-OF-CARDS BACKGROUND ===== -->
      <!--
        Two dark planes sit behind and to the right of the active video,
        slightly angled, to suggest a physical stack of video cards.
        They never move — they are pure decoration that communicates
        "there are more videos behind this one."
        Shown when the target is found; hidden when it is lost.
      -->
      <a-plane id="deck-card-1"
        width="1" height="0.5625"
        position="0.07 0.68 -0.01"
        rotation="0 0 -4"
        color="#444444" opacity="0.55"
        visible="false">
      </a-plane>

      <a-plane id="deck-card-2"
        width="1" height="0.5625"
        position="0.14 0.66 -0.02"
        rotation="0 0 -8"
        color="#333333" opacity="0.4"
        visible="false">
      </a-plane>

      <!-- ===== 3D NAVIGATION ARROWS ===== -->
      <!--
        Floating chevron characters on either side of the active video.
        They tell the user they can swipe left or right.
        Shown when the target is found; hidden when it is lost.
      -->
      <a-text id="arrow-left"
        value="❮"
        position="-0.65 0.7 0.05"
        align="center" color="white"
        width="3" visible="false">
      </a-text>

      <a-text id="arrow-right"
        value="❯"
        position="0.65 0.7 0.05"
        align="center" color="white"
        width="3" visible="false">
      </a-text>

      <!-- ===== VIDEO CAROUSEL PLANES ===== -->
      <!--
        All five planes share the same position. Only the active one is
        visible at a time. JavaScript controls visibility via updateLayout().
        To add a 6th video: duplicate a plane here and update VIDEO_COUNT.
      -->
      <a-video id="plane-0" src="#video-0" width="1" height="0.5625" position="0 0.7 0" visible="false"></a-video>
      <a-video id="plane-1" src="#video-1" width="1" height="0.5625" position="0 0.7 0" visible="false"></a-video>
      <a-video id="plane-2" src="#video-2" width="1" height="0.5625" position="0 0.7 0" visible="false"></a-video>
      <a-video id="plane-3" src="#video-3" width="1" height="0.5625" position="0 0.7 0" visible="false"></a-video>
      <a-video id="plane-4" src="#video-4" width="1" height="0.5625" position="0 0.7 0" visible="false"></a-video>

    </a-entity>
  </a-scene>

  <script>
    // ============================================================
    // CAROUSEL CONFIGURATION
    // ============================================================
    const VIDEO_COUNT      = 5;   // update if you add or remove videos
    const SWIPE_THRESHOLD  = 50;  // minimum px horizontal movement to count as a swipe


    // ============================================================
    // STARTUP
    // ============================================================
    window.addEventListener('DOMContentLoaded', function () {
      const sceneEl   = document.querySelector('a-scene');
      const loadingEl = document.getElementById('loading');
      const hintEl    = document.getElementById('swipe-hint');
      const dotEl     = document.getElementById('dot-indicator');

      // Capture AR system once A-Frame is ready, but don't start yet.
      // We wait for the user's tap so iOS accepts audio + camera together.
      let arSystem = null;
      sceneEl.addEventListener('loaded', function () {
        arSystem = sceneEl.systems['mindar-image-system'];
      });

      sceneEl.addEventListener('arReady', function () {
        loadingEl.style.display = 'none';
      });


      // ============================================================
      // CAROUSEL STATE
      // ============================================================
      let currentIndex    = 0;
      let isMarkerVisible = false;
      let hintShown       = false;

      const videos = [
        document.getElementById('video-0'),
        document.getElementById('video-1'),
        document.getElementById('video-2'),
        document.getElementById('video-3'),
        document.getElementById('video-4'),
      ];

      const planes = [
        document.getElementById('plane-0'),
        document.getElementById('plane-1'),
        document.getElementById('plane-2'),
        document.getElementById('plane-3'),
        document.getElementById('plane-4'),
      ];

      const dots = Array.from(document.querySelectorAll('.dot'));


      // ============================================================
      // DYNAMIC ASPECT RATIOS
      // ============================================================
      // Defaults to 16:9; overwritten as each video's metadata loads.
      const aspectRatios = [16/9, 16/9, 16/9, 16/9, 16/9];

      videos.forEach(function (vid, i) {
        vid.addEventListener('loadedmetadata', function () {
          if (vid.videoWidth && vid.videoHeight) {
            aspectRatios[i] = vid.videoWidth / vid.videoHeight;
          }
        });
      });

      function getPlaneHeight(index) {
        return 1 / aspectRatios[index]; // width is always 1 AR unit
      }


      // ============================================================
      // 3D INDICATOR ELEMENTS
      // ============================================================
      const deckCard1   = document.getElementById('deck-card-1');
      const deckCard2   = document.getElementById('deck-card-2');
      const arrowLeft   = document.getElementById('arrow-left');
      const arrowRight  = document.getElementById('arrow-right');

      // Show or hide all 3D depth/navigation indicators together.
      function setIndicatorsVisible(show) {
        deckCard1.setAttribute('visible', show);
        deckCard2.setAttribute('visible', show);
        arrowLeft.setAttribute('visible', show);
        arrowRight.setAttribute('visible', show);
      }


      // ============================================================
      // LAYOUT UPDATE
      // ============================================================
      // Shows only the active plane at the centre position.
      // Updates deck cards' height to match the active video.
      // Refreshes the dot indicator.
      function updateLayout() {
        // Hide all planes, then show only the active one.
        planes.forEach(function (p) { p.setAttribute('visible', false); });
        planes[currentIndex].setAttribute('position', '0 0.7 0');
        planes[currentIndex].setAttribute('height', getPlaneHeight(currentIndex));
        planes[currentIndex].setAttribute('visible', true);

        // Resize the deck cards to match the active video's aspect ratio
        // so the "stack" looks proportionally correct.
        var h = getPlaneHeight(currentIndex);
        deckCard1.setAttribute('height', h);
        deckCard2.setAttribute('height', h);

        // Highlight the correct dot.
        dots.forEach(function (d, i) {
          d.classList.toggle('active', i === currentIndex);
        });
      }


      // ============================================================
      // TAP-TO-START — iOS AUDIO UNLOCK
      // ============================================================
      // iOS Safari requires video.play() inside a user-gesture handler
      // to "unlock" the audio pipeline. The videos must be MUTED during
      // this unlock call — that is the iOS requirement. Audio is enabled
      // (muted = false) separately, right before each actual playback.
      const startBtn = document.getElementById('start-btn');
      startBtn.addEventListener('click', function () {
        startBtn.disabled = true;
        startBtn.textContent = 'Starting…';

        // Unlock all videos while still muted.
        videos.forEach(function (v) {
          v.play().catch(function () {});
          v.pause();
          v.currentTime = 0;
        });

        // Start the AR camera (also benefits from being in a gesture handler).
        if (arSystem) {
          arSystem.start();
        } else {
          sceneEl.addEventListener('loaded', function () {
            sceneEl.systems['mindar-image-system'].start();
          });
        }
      });


      // ============================================================
      // AUTO-ADVANCE PLAYLIST
      // ============================================================
      // 'ended' fires when a video plays to completion (loop is absent).
      videos.forEach(function (vid) {
        vid.addEventListener('ended', function () {
          if (!isMarkerVisible) return;
          switchVideo(+1);
        });
      });


      // ============================================================
      // SWITCH VIDEO
      // ============================================================
      // direction: +1 = next (swipe left), -1 = previous (swipe right)
      function switchVideo(direction) {
        if (!isMarkerVisible) return;

        // Pause and rewind the outgoing video.
        videos[currentIndex].pause();
        videos[currentIndex].currentTime = 0;

        currentIndex = (currentIndex + direction + VIDEO_COUNT) % VIDEO_COUNT;

        updateLayout();

        // Unmute right before playing — this is the two-step iOS audio pattern:
        // unlock (muted) in the gesture handler, then unmute here for real play.
        videos[currentIndex].muted = false;
        videos[currentIndex].play();
      }


      // ============================================================
      // AR TRACKING EVENTS
      // ============================================================
      const target = document.querySelector('[mindar-image-target]');

      target.addEventListener('targetFound', function () {
        isMarkerVisible = true;
        updateLayout();
        setIndicatorsVisible(true);
        dotEl.classList.add('visible');

        // Unmute + play the active video.
        videos[currentIndex].muted = false;
        videos[currentIndex].play();

        // Show swipe hint once on first detection.
        if (!hintShown) {
          hintShown = true;
          hintEl.classList.add('visible');
          setTimeout(function () { hintEl.classList.remove('visible'); }, 3000);
        }
      });

      target.addEventListener('targetLost', function () {
        isMarkerVisible = false;
        videos[currentIndex].pause();
        setIndicatorsVisible(false);
        dotEl.classList.remove('visible');
      });


      // ============================================================
      // SWIPE GESTURE DETECTION
      // ============================================================
      let touchStartX = 0;

      document.addEventListener('touchstart', function (e) {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      document.addEventListener('touchend', function (e) {
        var delta = e.changedTouches[0].screenX - touchStartX;
        if      (delta < -SWIPE_THRESHOLD) switchVideo(+1); // swipe left  → next
        else if (delta >  SWIPE_THRESHOLD) switchVideo(-1); // swipe right → prev
      }, { passive: true });

    }); // end DOMContentLoaded
  </script>
</body>
</html>
